name: Build and publish b.pdf

on:
  push:
    branches:
      - bevan

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk texlive-latex-extra texlive-plain-generic

      - name: Compile PDF and prepare Pages files
        run: |
          mkdir -p build _site

          latexmk -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -outdir=build \
            b.tex

          cp build/b.pdf _site/

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ST2334 Cheatsheet</title>
          </head>
          <body>
            <h1>ST2334 Cheatsheet</h1>
            <p><a href="b.pdf">Open or download b.pdf</a></p>
            <iframe
              src="b.pdf"
              title="ST2334 Cheatsheet"
              width="100%"
              height="900">
            </iframe>
          </body>
          </html>
          EOF

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
